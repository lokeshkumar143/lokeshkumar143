<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 132" width="100%" role="img" aria-label="Futuristic Engineering Quote">
  <defs>
    <linearGradient id="fq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14" />
      <stop offset="100%" stop-color="#0A1324" />
    </linearGradient>
    <linearGradient id="fq-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF2E63" stop-opacity="0.7" />
    </linearGradient>
    <filter id="fq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="4" y="4" width="872" height="124" rx="14" fill="url(#fq-bg)" stroke="url(#fq-border)" stroke-width="1.3" />
  <path d="M 14 28 L 14 14 L 28 14" fill="none" stroke="#00F5D4" stroke-width="2" filter="url(#fq-glow)" />
  <path d="M 866 104 L 866 118 L 852 118" fill="none" stroke="#FF2E63" stroke-width="2" filter="url(#fq-glow)" />

  <circle cx="34" cy="30" r="3.5" fill="#00F5D4" filter="url(#fq-glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="46" y="34" class="mono" font-size="10.5" font-weight="700" fill="#00F5D4" letter-spacing="1.4">// TRANSMISSION // ENGINEERING MANIFESTO</text>

  <text x="34" y="64" class="sans" font-size="15.5" font-weight="600" fill="#F8FAFC">
    &#8220;Code is the neural canvas where precision meets imagination &#8212;
  </text>
  <text x="34" y="88" class="sans" font-size="15.5" font-weight="600" fill="#CBD5E1">
    shipping fast, shipping clean, and owning every pixel in production.&#8221;
  </text>

  <text x="846" y="110" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#38BDF8">
    &#8212; <tspan fill="#FF2E63">LOKESH KUMAR S</tspan>
  </text>
</svg>
