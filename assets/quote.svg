<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" role="img" aria-label="Engineering Philosophy">
  <defs>
    <linearGradient id="q-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#131926" />
    </linearGradient>
    <linearGradient id="q-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#273142" />
      <stop offset="50%" stop-color="#F05138" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.6" />
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="4" y="4" width="872" height="122" rx="12" fill="url(#q-bg)" stroke="url(#q-border)" stroke-width="1.3" />
  <rect x="4" y="24" width="4" height="82" rx="2" fill="#F05138" />

  <text x="34" y="34" class="mono" font-size="11" font-weight="700" fill="#F05138" letter-spacing="1.2">// ENGINEERING PHILOSOPHY</text>

  <text x="34" y="64" class="sans" font-size="16" font-weight="500" fill="#F1F5F9">
    &#8220;Ships fast, ships clean, and takes real ownership of outcomes &#8212;
  </text>
  <text x="34" y="88" class="sans" font-size="16" font-weight="500" fill="#E2E8F0">
    sculpting thoughtful architecture into living mobile experiences.&#8221;
  </text>

  <text x="846" y="108" text-anchor="end" class="mono" font-size="12" font-weight="600" fill="#94A3B8">
    &#8212; <tspan fill="#FF7A59">Lokesh Kumar S</tspan>
  </text>
</svg>
