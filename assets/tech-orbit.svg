<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 124" width="100%" role="img" aria-label="Animated Neural Tech Pipeline">
  <defs>
    <linearGradient id="t-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050A14" />
      <stop offset="50%" stop-color="#0A1222" />
      <stop offset="100%" stop-color="#050A14" />
    </linearGradient>
    <filter id="t-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      @keyframes bus {
        to { stroke-dashoffset: -60; }
      }
      .bus-flow { stroke-dasharray: 8 8; animation: bus 1.8s linear infinite; }
    </style>
  </defs>

  <rect x="8" y="8" width="944" height="108" rx="14" fill="url(#t-bg)" stroke="#1E293B" stroke-width="1.3" />

  <!-- Connecting Energy Bus Lines -->
  <path id="bus-1" d="M 300 62 L 352 62" fill="none" stroke="#00F5D4" stroke-width="2" class="bus-flow" filter="url(#t-glow)" />
  <path id="bus-2" d="M 608 62 L 660 62" fill="none" stroke="#FF2E63" stroke-width="2" class="bus-flow" filter="url(#t-glow)" />

  <circle r="3.5" fill="#FFFFFF" filter="url(#t-glow)">
    <animateMotion dur="1.4s" repeatCount="indefinite">
      <mpath href="#bus-1" />
    </animateMotion>
  </circle>
  <circle r="3.5" fill="#FFFFFF" filter="url(#t-glow)">
    <animateMotion dur="1.4s" repeatCount="indefinite">
      <mpath href="#bus-2" />
    </animateMotion>
  </circle>

  <!-- Node 1: Languages -->
  <rect x="26" y="22" width="274" height="80" rx="10" fill="#07111F" stroke="#00F5D4" stroke-opacity="0.5" stroke-width="1.2" />
  <text x="42" y="43" class="mono" font-size="10.5" font-weight="700" fill="#00F5D4">01 // LANGUAGES</text>
  <text x="42" y="65" class="sans" font-size="13.5" font-weight="700" fill="#F8FAFC">Swift &#183; C++ &#183; Java &#183; Python</text>
  <text x="42" y="85" class="mono" font-size="11" fill="#94A3B8">PHP &#183; JavaScript &#183; HTML/CSS</text>

  <!-- Node 2: Mobile & Cloud -->
  <rect x="352" y="22" width="256" height="80" rx="10" fill="#081224" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.2" />
  <text x="368" y="43" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8">02 // IOS &amp; BACKEND</text>
  <text x="368" y="65" class="sans" font-size="13.5" font-weight="700" fill="#F8FAFC">SwiftUI &#183; UIKit &#183; Xcode</text>
  <text x="368" y="85" class="mono" font-size="11" fill="#94A3B8">Firebase &#183; MySQL &#183; REST &#183; AI</text>

  <!-- Node 3: 4-Layer QA -->
  <rect x="660" y="22" width="274" height="80" rx="10" fill="#140919" stroke="#FF2E63" stroke-opacity="0.5" stroke-width="1.2" />
  <text x="676" y="43" class="mono" font-size="10.5" font-weight="700" fill="#FF2E63">03 // 4-LAYER QA &amp; OPS</text>
  <text x="676" y="65" class="sans" font-size="13.5" font-weight="700" fill="#F8FAFC">Appium &#183; Selenium &#183; Postman</text>
  <text x="676" y="85" class="mono" font-size="11" fill="#94A3B8">Load &#183; Security &#183; Git &#183; Figma</text>
</svg>

