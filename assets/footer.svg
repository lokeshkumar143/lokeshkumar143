<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 96" width="100%" role="img" aria-label="Animated Plasma Wave Footer">
  <defs>
    <linearGradient id="wave-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="wave-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FF2E63" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1" />
    </linearGradient>
    <clipPath id="footer-clip">
      <rect x="8" y="8" width="944" height="80" rx="14" />
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="8" y="8" width="944" height="80" rx="14" fill="#050A14" stroke="#1E293B" stroke-width="1.2" />

  <g clip-path="url(#footer-clip)">
    <!-- Animated Plasma Wave 1 -->
    <path d="M -200 66 Q -80 42 40 66 T 280 66 T 520 66 T 760 66 T 1000 66 T 1240 66" fill="none" stroke="url(#wave-1)" stroke-width="2">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-240 0" dur="4s" repeatCount="indefinite" />
    </path>
    <!-- Animated Plasma Wave 2 -->
    <path d="M -240 70 Q -120 88 0 70 T 240 70 T 480 70 T 720 70 T 960 70 T 1200 70" fill="none" stroke="url(#wave-2)" stroke-width="1.8">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="240 0" dur="5.5s" repeatCount="indefinite" />
    </path>
  </g>

  <circle cx="32" cy="36" r="4" fill="#00F5D4">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text x="46" y="40" class="mono" font-size="11.5" font-weight="700" fill="#94A3B8">
    <tspan fill="#00F5D4">SIGNAL LOCKED</tspan> &#160;//&#160; SWIFTUI &#183; UIKIT &#183; AI SYSTEMS &#183; 4-LAYER QA
  </text>

  <text x="928" y="40" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#64748B">
    ARCHITECTED BY <tspan fill="#FF2E63">LOKESH KUMAR S</tspan> &#183; &#169; 2026
  </text>
</svg>
