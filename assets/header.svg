<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img" aria-label="Lokesh Kumar S - Futuristic Neural Command HUD">
  <defs>
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03060E" />
      <stop offset="50%" stop-color="#070D1D" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="holo-text" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#FF2E63" />
      <stop offset="100%" stop-color="#00F5D4" />
      <animate attributeName="x1" values="0%;-100%;0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%;200%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="hud-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF2E63" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="scan-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#03060E" stop-opacity="0" />
    </radialGradient>

    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32" />
    </filter>

    <pattern id="cyber-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00F5D4" stroke-width="0.6" stroke-opacity="0.07" />
      <circle cx="0" cy="0" r="1.2" fill="#38BDF8" fill-opacity="0.16" />
    </pattern>

    <clipPath id="frame-clip">
      <rect x="6" y="6" width="948" height="328" rx="18" />
    </clipPath>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }
      @keyframes flow {
        to { stroke-dashoffset: -120; }
      }
      .circuit-flow {
        stroke-dasharray: 10 14;
        animation: flow 3s linear infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.15; }
      }
      .blink { animation: blink 1.2s infinite; }
    </style>
  </defs>

  <!-- Outer Frame & Space Backdrop -->
  <rect x="6" y="6" width="948" height="328" rx="18" fill="url(#space-bg)" stroke="url(#hud-border)" stroke-width="1.6" />

  <g clip-path="url(#frame-clip)">
    <rect x="6" y="6" width="948" height="328" fill="url(#cyber-grid)" />

    <!-- Ambient Nebulae -->
    <circle cx="150" cy="90" r="130" fill="#00F5D4" opacity="0.09" filter="url(#ambient)" />
    <circle cx="755" cy="170" r="150" fill="#38BDF8" opacity="0.12" filter="url(#ambient)" />
    <circle cx="520" cy="290" r="110" fill="#FF2E63" opacity="0.09" filter="url(#ambient)" />

    <!-- Animated Holographic Scan Beam -->
    <rect x="6" y="-40" width="948" height="44" fill="url(#scan-beam)">
      <animate attributeName="y" values="-40;345;-40" dur="7s" repeatCount="indefinite" />
    </rect>

    <!-- Animated Neural Circuit Traces -->
    <path d="M 6 68 L 42 68 L 62 48 L 580 48 L 605 73 L 755 73" fill="none" stroke="#00F5D4" stroke-opacity="0.18" stroke-width="1.2" />
    <path d="M 6 68 L 42 68 L 62 48 L 580 48 L 605 73 L 755 73" fill="none" stroke="#00F5D4" stroke-width="1.5" class="circuit-flow" />

    <path d="M 556 260 L 600 260 L 625 285 L 954 285" fill="none" stroke="#FF2E63" stroke-opacity="0.22" stroke-width="1.2" />
    <path d="M 556 260 L 600 260 L 625 285 L 954 285" fill="none" stroke="#FF2E63" stroke-width="1.6" class="circuit-flow" />
  </g>

  <!-- Corner Cybernetic Brackets -->
  <path d="M 18 46 L 18 18 L 48 18" fill="none" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" filter="url(#neon)" />
  <path d="M 942 46 L 942 18 L 912 18" fill="none" stroke="#FF2E63" stroke-width="2.5" stroke-linecap="round" filter="url(#neon)" />
  <path d="M 18 294 L 18 322 L 48 322" fill="none" stroke="#FF2E63" stroke-width="2.5" stroke-linecap="round" filter="url(#neon)" />
  <path d="M 942 294 L 942 322 L 912 322" fill="none" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" filter="url(#neon)" />

  <!-- Top Status Pill -->
  <rect x="36" y="28" width="328" height="24" rx="12" fill="#071320" stroke="#00F5D4" stroke-opacity="0.55" stroke-width="1" />
  <circle cx="52" cy="40" r="4" fill="#00F5D4" filter="url(#neon)">
    <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text x="64" y="44" class="mono" font-size="10.5" font-weight="700" fill="#67E8F9" letter-spacing="1.2">NEURAL CORE v2.6 // SYSTEM ONLINE</text>

  <!-- Main Animated Holographic Title -->
  <text x="36" y="102" class="sans" font-size="43" font-weight="900" fill="url(#holo-text)" letter-spacing="2" filter="url(#neon)">LOKESH KUMAR S</text>
  <text x="36" y="102" class="sans" font-size="43" font-weight="900" fill="#FFFFFF" fill-opacity="0.25" letter-spacing="2">LOKESH KUMAR S</text>

  <!-- Subtitle -->
  <text x="36" y="132" class="mono" font-size="13" font-weight="700" letter-spacing="1.8">
    <tspan fill="#00F5D4">IOS ARCHITECT</tspan>
    <tspan fill="#475569"> // </tspan>
    <tspan fill="#F8FAFC">AI &amp; FULL-STACK</tspan>
    <tspan fill="#475569"> // </tspan>
    <tspan fill="#FF2E63">TECH TRAINER</tspan>
  </text>

  <!-- Left Telemetry Panel -->
  <rect x="36" y="152" width="530" height="156" rx="12" fill="#060B16" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.3" />
  <rect x="36" y="152" width="530" height="28" rx="12" fill="#0C1526" />
  <line x1="36" y1="180" x2="566" y2="180" stroke="#1E293B" stroke-width="1" />

  <text x="52" y="170" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1">MISSION TELEMETRY // SIMATS ENGINEERING</text>

  <!-- Animated Equalizer Wave Bars -->
  <g transform="translate(490, 158)">
    <rect x="0" y="6" width="3" height="10" rx="1" fill="#00F5D4">
      <animate attributeName="height" values="4;14;6;12;4" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="12;2;10;4;12" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="6" y="3" width="3" height="13" rx="1" fill="#38BDF8">
      <animate attributeName="height" values="12;4;15;5;12" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="4;12;1;11;4" dur="0.9s" repeatCount="indefinite" />
    </rect>
    <rect x="12" y="7" width="3" height="9" rx="1" fill="#FF2E63">
      <animate attributeName="height" values="6;15;4;13;6" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="10;1;12;3;10" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <rect x="18" y="4" width="3" height="12" rx="1" fill="#A855F7">
      <animate attributeName="height" values="14;5;11;3;14" dur="1.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="2;11;5;13;2" dur="1.0s" repeatCount="indefinite" />
    </rect>
    <rect x="24" y="6" width="3" height="10" rx="1" fill="#00F5D4">
      <animate attributeName="height" values="5;13;7;15;5" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="11;3;9;1;11" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="30" y="5" width="3" height="11" rx="1" fill="#38BDF8">
      <animate attributeName="height" values="10;3;14;6;10" dur="0.85s" repeatCount="indefinite" />
      <animate attributeName="y" values="6;13;2;10;6" dur="0.85s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Telemetry Rows -->
  <text x="52" y="203" class="mono" font-size="11.5" fill="#94A3B8">
    <tspan fill="#00F5D4">[01]</tspan> <tspan fill="#E2E8F0" font-weight="700">VELOCITY  :</tspan> Intern &#8594; Full-Time iOS Dev (2 Months)
  </text>
  <text x="52" y="224" class="mono" font-size="11.5" fill="#94A3B8">
    <tspan fill="#38BDF8">[02]</tspan> <tspan fill="#E2E8F0" font-weight="700">APPLE OS  :</tspan> Swift &#183; SwiftUI &#183; UIKit &#183; App Store Shipper
  </text>
  <text x="52" y="245" class="mono" font-size="11.5" fill="#94A3B8">
    <tspan fill="#FF2E63">[03]</tspan> <tspan fill="#E2E8F0" font-weight="700">QA SHIELD :</tspan> Appium &#183; Selenium &#183; Postman &#183; Load &amp; Security
  </text>
  <text x="52" y="266" class="mono" font-size="11.5" fill="#94A3B8">
    <tspan fill="#A855F7">[04]</tspan> <tspan fill="#E2E8F0" font-weight="700">AI &amp; EDU  :</tspan> Oracle AI Certified &#183; Technical Trainer
  </text>

  <!-- Live Energy Bar at Bottom of Telemetry -->
  <rect x="52" y="283" width="496" height="10" rx="5" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <rect x="54" y="285" width="160" height="6" rx="3" fill="url(#holo-text)">
    <animate attributeName="width" values="120;440;260;492;120" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Right Zone: Rotating Holographic Orbital Gyroscope -->
  <g transform="translate(765, 170)">
    <circle cx="0" cy="0" r="132" fill="url(#core-glow)" />

    <!-- Outer Dashed Ring (Clockwise) -->
    <g>
      <circle cx="0" cy="0" r="122" fill="none" stroke="#00F5D4" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="18 10 4 10" />
      <circle cx="0" cy="-122" r="4.5" fill="#00F5D4" filter="url(#neon)" />
      <circle cx="0" cy="122" r="4.5" fill="#38BDF8" filter="url(#neon)" />
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite" />
    </g>

    <!-- Middle Segmented Ring (Counter-Clockwise) -->
    <g>
      <circle cx="0" cy="0" r="96" fill="none" stroke="#FF2E63" stroke-width="2.2" stroke-opacity="0.7" stroke-dasharray="44 18 14 18" />
      <circle cx="96" cy="0" r="4" fill="#FF2E63" filter="url(#neon)" />
      <circle cx="-96" cy="0" r="4" fill="#A855F7" filter="url(#neon)" />
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite" />
    </g>

    <!-- Inner Precision Ring (Clockwise Fast) -->
    <g>
      <circle cx="0" cy="0" r="70" fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.75" stroke-dasharray="8 8" />
      <path d="M 0 -70 A 70 70 0 0 1 60.6 -35" fill="none" stroke="#00F5D4" stroke-width="3" stroke-linecap="round" filter="url(#neon)" />
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite" />
    </g>

    <!-- Pulsing Core Ring -->
    <circle cx="0" cy="0" r="48" fill="#070D1D" stroke="#00F5D4" stroke-width="1.8" filter="url(#neon)">
      <animate attributeName="stroke" values="#00F5D4;#38BDF8;#FF2E63;#00F5D4" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Core Identity Text -->
    <text x="0" y="-4" text-anchor="middle" class="sans" font-size="22" font-weight="900" fill="#F8FAFC" letter-spacing="2">LK.OS</text>
    <text x="0" y="15" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#00F5D4" letter-spacing="1.2">iOS // AI</text>
    <circle cx="0" cy="27" r="2.8" fill="#30D158" class="blink" />

    <!-- Orbital Node Tags (Static readable labels at 4 quadrants) -->
    <g transform="translate(-145, -96)">
      <rect width="58" height="20" rx="6" fill="#071320" stroke="#00F5D4" stroke-opacity="0.6" stroke-width="1" />
      <text x="29" y="13.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#67E8F9">SWIFTUI</text>
    </g>
    <g transform="translate(88, -96)">
      <rect width="58" height="20" rx="6" fill="#170914" stroke="#FF2E63" stroke-opacity="0.6" stroke-width="1" />
      <text x="29" y="13.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#FDA4AF">4-QA</text>
    </g>
    <g transform="translate(-145, 76)">
      <rect width="58" height="20" rx="6" fill="#091526" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1" />
      <text x="29" y="13.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#93C5FD">UIKIT</text>
    </g>
    <g transform="translate(88, 76)">
      <rect width="58" height="20" rx="6" fill="#140B24" stroke="#A855F7" stroke-opacity="0.6" stroke-width="1" />
      <text x="29" y="13.5" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#D8B4FE">AI CORE</text>
    </g>
  </g>
</svg>
