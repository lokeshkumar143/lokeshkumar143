<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" role="img" aria-label="Lokesh Kumar S - iOS Developer and Technical Trainer">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="55%" stop-color="#111622" />
      <stop offset="100%" stop-color="#090C12" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F05138" />
      <stop offset="50%" stop-color="#FF3B5C" />
      <stop offset="100%" stop-color="#FF7A45" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="50%" stop-color="#F05138" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="phone-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141A26" />
      <stop offset="100%" stop-color="#0B0F18" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>

    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.08" />
    </pattern>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1.1s infinite; }
    </style>
  </defs>

  <!-- Main Xcode Window Shell -->
  <rect x="8" y="8" width="944" height="304" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
  <rect x="8" y="8" width="944" height="304" rx="16" fill="url(#dot-grid)" />

  <!-- Ambient Glows -->
  <circle cx="180" cy="110" r="110" fill="#F05138" opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="780" cy="200" r="110" fill="#0A84FF" opacity="0.10" filter="url(#soft-glow)" />

  <!-- Window Top Bar -->
  <path d="M 8 24 Q 8 8 24 8 L 936 8 Q 952 8 952 24 L 952 46 L 8 46 Z" fill="#161B26" fill-opacity="0.92" />
  <line x1="8" y1="46" x2="952" y2="46" stroke="#262E3D" stroke-width="1" />

  <!-- macOS Traffic Lights -->
  <circle cx="32" cy="27" r="6" fill="#FF5F56" />
  <circle cx="52" cy="27" r="6" fill="#FFBD2E" />
  <circle cx="72" cy="27" r="6" fill="#27C93F" />

  <!-- Active File Tab -->
  <rect x="98" y="15" width="218" height="24" rx="6" fill="#0D111A" stroke="#2D3648" stroke-width="1" />
  <text x="114" y="31" class="mono" font-size="11.5" fill="#F05138" font-weight="700">Swift</text>
  <text x="155" y="31" class="mono" font-size="11.5" fill="#CBD5E1">LokeshKumar.swift</text>

  <!-- Build Status Pill -->
  <rect x="720" y="15" width="214" height="24" rx="12" fill="#0F1F18" stroke="#30D158" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="736" cy="27" r="4" fill="#30D158">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="748" y="31" class="mono" font-size="11" font-weight="600" fill="#6EE7B7">Build Succeeded • Ready</text>

  <!-- Left Column: Identity & Swift Code Card -->
  <rect x="38" y="64" width="256" height="22" rx="11" fill="#F05138" fill-opacity="0.14" stroke="#F05138" stroke-opacity="0.5" stroke-width="1" />
  <text x="166" y="79" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FF7A59" letter-spacing="1.1">IOS ENGINEER • INDIA</text>

  <text x="38" y="126" class="sans" font-size="40" font-weight="800" fill="#F8FAFC" letter-spacing="1.5">LOKESH KUMAR S</text>
  <rect x="38" y="135" width="120" height="3" rx="1.5" fill="url(#accent-grad)" />

  <text x="38" y="158" class="sans" font-size="15" font-weight="600" fill="#94A3B8">
    <tspan fill="#E2E8F0">iOS Developer &amp; Technical Trainer</tspan>
    <tspan fill="#F05138"> @ </tspan>
    <tspan fill="#60A5FA">SIMATS</tspan>
  </text>

  <!-- Swift Code Editor Card -->
  <rect x="38" y="176" width="548" height="116" rx="10" fill="#090D14" stroke="#232B3A" stroke-width="1.2" />
  <text x="54" y="199" class="mono" font-size="12" fill="#475569">1</text>
  <text x="74" y="199" class="mono" font-size="12" fill="#E2E8F0">
    <tspan fill="#FF7B72">struct</tspan> <tspan fill="#79C0FF">Lokesh</tspan>: <tspan fill="#FFA657">iOSDeveloper</tspan>, <tspan fill="#FFA657">Mentor</tspan> {
  </text>

  <text x="54" y="219" class="mono" font-size="12" fill="#475569">2</text>
  <text x="74" y="219" class="mono" font-size="12" fill="#E2E8F0">
    &#160;&#160;<tspan fill="#FF7B72">let</tspan> growth   = <tspan fill="#A5D6FF">"Intern &#8594; Full-Time in 2 Months"</tspan>
  </text>

  <text x="54" y="239" class="mono" font-size="12" fill="#475569">3</text>
  <text x="74" y="239" class="mono" font-size="12" fill="#E2E8F0">
    &#160;&#160;<tspan fill="#FF7B72">let</tspan> stack    = [<tspan fill="#A5D6FF">"SwiftUI"</tspan>, <tspan fill="#A5D6FF">"UIKit"</tspan>, <tspan fill="#A5D6FF">"AI"</tspan>, <tspan fill="#A5D6FF">"QA"</tspan>]
  </text>

  <text x="54" y="259" class="mono" font-size="12" fill="#475569">4</text>
  <text x="74" y="259" class="mono" font-size="12" fill="#E2E8F0">
    &#160;&#160;<tspan fill="#FF7B72">let</tspan> shipping = <tspan fill="#7EE787">true</tspan> <tspan fill="#64748B">// End-to-End App Store</tspan>
  </text>

  <text x="54" y="279" class="mono" font-size="12" fill="#475569">5</text>
  <text x="74" y="279" class="mono" font-size="12" fill="#E2E8F0">}</text>
  <rect x="85" y="268" width="7" height="14" rx="1" fill="#F05138" class="cursor" />

  <!-- Right Column: iPhone Simulator Preview Card -->
  <rect x="614" y="64" width="312" height="228" rx="26" fill="url(#phone-bg)" stroke="#334155" stroke-width="2" />
  <!-- Subtle inner bezel -->
  <rect x="620" y="70" width="300" height="216" rx="21" fill="none" stroke="#1E293B" stroke-width="1" />

  <!-- Dynamic Island -->
  <rect x="720" y="78" width="100" height="19" rx="9.5" fill="#030508" stroke="#1E293B" stroke-width="1" />
  <circle cx="735" cy="87.5" r="3.5" fill="#F05138">
    <animate attributeName="fill" values="#F05138;#30D158;#0A84FF;#F05138" dur="6s" repeatCount="indefinite" />
  </circle>
  <text x="778" y="91" text-anchor="middle" class="mono" font-size="9" font-weight="600" fill="#94A3B8">SIMULATOR</text>

  <!-- Phone Screen Header -->
  <text x="638" y="116" class="sans" font-size="12" font-weight="700" fill="#F8FAFC">Career Snapshot</text>
  <text x="902" y="116" text-anchor="end" class="mono" font-size="10" font-weight="700" fill="#30D158">&#9679; LIVE</text>

  <!-- Widget 1 -->
  <rect x="636" y="126" width="268" height="44" rx="10" fill="#161E2E" stroke="#273248" stroke-width="1" />
  <rect x="646" y="136" width="24" height="24" rx="6" fill="#F05138" fill-opacity="0.18" />
  <text x="658" y="152" text-anchor="middle" class="sans" font-size="13" fill="#FF7A59">&#9889;</text>
  <text x="680" y="145" class="sans" font-size="12" font-weight="700" fill="#F1F5F9">Fast-Track Promotion</text>
  <text x="680" y="161" class="sans" font-size="10.5" fill="#94A3B8">Intern &#8594; Full-Time iOS Dev (2 Mo)</text>

  <!-- Widget 2 -->
  <rect x="636" y="178" width="268" height="44" rx="10" fill="#161E2E" stroke="#273248" stroke-width="1" />
  <rect x="646" y="188" width="24" height="24" rx="6" fill="#0A84FF" fill-opacity="0.18" />
  <rect x="653" y="192" width="10" height="16" rx="2" fill="none" stroke="#60A5FA" stroke-width="1.5" />
  <line x1="656.5" y1="205.5" x2="659.5" y2="205.5" stroke="#60A5FA" stroke-width="1.2" stroke-linecap="round" />
  <text x="680" y="197" class="sans" font-size="12" font-weight="700" fill="#F1F5F9">App Store Production</text>
  <text x="680" y="213" class="sans" font-size="10.5" fill="#94A3B8">SwiftUI &#183; UIKit &#183; Core Location &#183; APIs</text>

  <!-- Widget 3 -->
  <rect x="636" y="230" width="268" height="44" rx="10" fill="#161E2E" stroke="#273248" stroke-width="1" />
  <rect x="646" y="240" width="24" height="24" rx="6" fill="#30D158" fill-opacity="0.18" />
  <text x="658" y="256" text-anchor="middle" class="sans" font-size="12" fill="#30D158">&#10003;</text>
  <text x="680" y="249" class="sans" font-size="12" font-weight="700" fill="#F1F5F9">4-Layer QA + Technical Trainer</text>
  <text x="680" y="265" class="sans" font-size="10.5" fill="#94A3B8">Appium &#183; Selenium &#183; Security &#183; Oracle AI</text>
</svg>
