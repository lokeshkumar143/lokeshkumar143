    <line x1="18" y1="554" x2="482" y2="554" stroke="#222B3B" stroke-width="1" />
    <text x="22" y="579" class="mono" font-size="12" fill="#94A3B8">
      <tspan fill="#00F5D4">lokesh@github</tspan>:<tspan fill="#38BDF8">~</tspan>$ whoami <tspan fill="#F8FAFC" font-weight="700">Lokesh Kumar .S</tspan>
