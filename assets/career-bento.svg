<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" role="img" aria-label="Career Highlights Bento Grid">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D121C" />
      <stop offset="100%" stop-color="#131926" />
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Card 1: Fast-Track Growth -->
  <rect x="8" y="8" width="465" height="98" rx="14" fill="url(#card-bg)" stroke="#273142" stroke-width="1.2" />
  <rect x="8" y="24" width="3.5" height="66" rx="1.75" fill="#F05138" />
  <rect x="26" y="22" width="108" height="22" rx="6" fill="#F05138" fill-opacity="0.14" stroke="#F05138" stroke-opacity="0.35" stroke-width="1" />
  <text x="80" y="37" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FF7A59">01 / VELOCITY</text>
  <text x="146" y="37" class="sans" font-size="15.5" font-weight="700" fill="#F8FAFC">Intern &#8594; Full-Time in 2 Months</text>
  <text x="26" y="64" class="sans" font-size="12.5" fill="#94A3B8">Promoted rapidly at SIMATS Engineering Institution for taking</text>
  <text x="26" y="83" class="sans" font-size="12.5" fill="#94A3B8">full ownership from UI design to live App Store deployment.</text>

  <!-- Animated trajectory sparkline -->
  <polyline points="404,42 418,38 430,30 444,24 456,18" fill="none" stroke="#F05138" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="456" cy="18" r="3" fill="#FF7A59">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Card 2: Native iOS Architecture -->
  <rect x="487" y="8" width="465" height="98" rx="14" fill="url(#card-bg)" stroke="#273142" stroke-width="1.2" />
  <rect x="487" y="24" width="3.5" height="66" rx="1.75" fill="#0A84FF" />
  <rect x="505" y="22" width="108" height="22" rx="6" fill="#0A84FF" fill-opacity="0.14" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="1" />
  <text x="559" y="37" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#60A5FA">02 / NATIVE IOS</text>
  <text x="625" y="37" class="sans" font-size="15.5" font-weight="700" fill="#F8FAFC">SwiftUI &#183; UIKit &#183; App Store</text>
  <text x="505" y="64" class="sans" font-size="12.5" fill="#94A3B8">Clean Architecture, Core Location, MapKit, RESTful APIs,</text>
  <text x="505" y="83" class="sans" font-size="12.5" fill="#94A3B8">Firebase Realtime DB, Push Notifications &amp; PHP/MySQL backends.</text>

  <!-- Card 3: 4-Layer QA & Security -->
  <rect x="8" y="114" width="465" height="98" rx="14" fill="url(#card-bg)" stroke="#273142" stroke-width="1.2" />
  <rect x="8" y="130" width="3.5" height="66" rx="1.75" fill="#30D158" />
  <rect x="26" y="128" width="108" height="22" rx="6" fill="#30D158" fill-opacity="0.14" stroke="#30D158" stroke-opacity="0.35" stroke-width="1" />
  <text x="80" y="143" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#6EE7B7">03 / QUALITY</text>
  <text x="146" y="143" class="sans" font-size="15.5" font-weight="700" fill="#F8FAFC">4-Discipline QA &amp; Security</text>
  <text x="26" y="170" class="sans" font-size="12.5" fill="#94A3B8">Mobile &amp; web automation with Appium &amp; Selenium, API verification</text>
  <text x="26" y="189" class="sans" font-size="12.5" fill="#94A3B8">via Postman, plus Load Testing &amp; Security Vulnerability checks.</text>

  <!-- Card 4: Mentorship & AI -->
  <rect x="487" y="114" width="465" height="98" rx="14" fill="url(#card-bg)" stroke="#273142" stroke-width="1.2" />
  <rect x="487" y="130" width="3.5" height="66" rx="1.75" fill="#BF5AF2" />
  <rect x="505" y="128" width="108" height="22" rx="6" fill="#BF5AF2" fill-opacity="0.14" stroke="#BF5AF2" stroke-opacity="0.35" stroke-width="1" />
  <text x="559" y="143" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#D8B4FE">04 / LEADERSHIP</text>
  <text x="625" y="143" class="sans" font-size="15.5" font-weight="700" fill="#F8FAFC">Technical Trainer &amp; Oracle AI</text>
  <text x="505" y="170" class="sans" font-size="12.5" fill="#94A3B8">Mentoring upcoming developers @ SIMATS while building AI-powered</text>
  <text x="505" y="189" class="sans" font-size="12.5" fill="#94A3B8">healthcare &amp; diagnostic apps &#183; B.E. CSE (7.9 CGPA).</text>
</svg>

