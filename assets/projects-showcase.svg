<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" role="img" aria-label="Animated Holographic Project Blueprints">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14" />
      <stop offset="100%" stop-color="#0B1324" />
    </linearGradient>
    <filter id="p-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }
      @keyframes ecg {
        0% { stroke-dashoffset: 260; }
        100% { stroke-dashoffset: 0; }
      }
      .ecg-line {
        stroke-dasharray: 180 80;
        animation: ecg 2.6s linear infinite;
      }
    </style>
  </defs>

  <!-- Blueprint 1: Patient Recovery Fitness AI -->
  <rect x="8" y="8" width="465" height="204" rx="14" fill="url(#p-bg)" stroke="#00F5D4" stroke-opacity="0.5" stroke-width="1.4" />
  <rect x="24" y="22" width="162" height="20" rx="6" fill="#062229" stroke="#00F5D4" stroke-opacity="0.5" stroke-width="1" />
  <text x="105" y="35.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#00F5D4">BLUEPRINT // 01-IOS-MED</text>

  <circle cx="442" cy="32" r="4" fill="#30D158" filter="url(#p-glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <text x="430" y="35.5" text-anchor="end" class="mono" font-size="9.5" font-weight="700" fill="#6EE7B7">SYNC ACTIVE</text>

  <text x="24" y="66" class="sans" font-size="17" font-weight="800" fill="#F8FAFC">Personal Fitness Trainer</text>
  <text x="24" y="84" class="sans" font-size="12.5" font-weight="600" fill="#38BDF8">Patient Recovery &amp; AI Consultation iOS App</text>

  <!-- Live ECG Monitor Strip -->
  <rect x="24" y="96" width="433" height="46" rx="8" fill="#030710" stroke="#162338" stroke-width="1" />
  <path d="M 32 119 L 110 119 L 122 119 L 130 105 L 138 134 L 146 102 L 154 128 L 162 119 L 250 119 L 260 106 L 268 132 L 276 103 L 284 126 L 292 119 L 448 119"
        fill="none" stroke="#00F5D4" stroke-opacity="0.2" stroke-width="1.5" />
  <path d="M 32 119 L 110 119 L 122 119 L 130 105 L 138 134 L 146 102 L 154 128 L 162 119 L 250 119 L 260 106 L 268 132 L 276 103 L 284 126 L 292 119 L 448 119"
        fill="none" stroke="#00F5D4" stroke-width="2" stroke-linecap="round" class="ecg-line" filter="url(#p-glow)" />

  <text x="24" y="164" class="sans" font-size="12" fill="#CBD5E1">Native SwiftUI healthcare app with doctor-patient scheduling,</text>
  <text x="24" y="181" class="sans" font-size="12" fill="#CBD5E1">in-app AI chatbot &amp; real-time PHP/MySQL REST sync.</text>
  <text x="24" y="200" class="mono" font-size="10.5" fill="#67E8F9">SWIFT &#183; SWIFTUI &#183; XCODE &#183; REST &#183; PHP &#183; MYSQL &#183; AI</text>

  <!-- Blueprint 2: Smart Ulcer Predictor -->
  <rect x="487" y="8" width="465" height="204" rx="14" fill="url(#p-bg)" stroke="#FF2E63" stroke-opacity="0.5" stroke-width="1.4" />
  <rect x="503" y="22" width="162" height="20" rx="6" fill="#250918" stroke="#FF2E63" stroke-opacity="0.5" stroke-width="1" />
  <text x="584" y="35.5" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#FF2E63">BLUEPRINT // 02-AI-VISION</text>

  <circle cx="921" cy="32" r="4" fill="#FF2E63" filter="url(#p-glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <text x="909" y="35.5" text-anchor="end" class="mono" font-size="9.5" font-weight="700" fill="#FDA4AF">SCANNING</text>

  <text x="503" y="66" class="sans" font-size="17" font-weight="800" fill="#F8FAFC">Smart Ulcer Predictor</text>
  <text x="503" y="84" class="sans" font-size="12.5" font-weight="600" fill="#C084FC">Deep-Learning Clinical Imaging Triage Tool</text>

  <!-- Live AI Vision Scanner Box -->
  <rect x="503" y="96" width="433" height="46" rx="8" fill="#030710" stroke="#28162C" stroke-width="1" />
  <!-- Target Reticle on Left of Scanner -->
  <g transform="translate(534, 119)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#FF2E63" stroke-width="1.3" stroke-dasharray="6 4">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#00F5D4" stroke-width="1.2" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>
  <!-- Sweeping Laser Line -->
  <line x1="564" y1="102" x2="924" y2="102" stroke="#FF2E63" stroke-width="1.4" stroke-opacity="0.85" filter="url(#p-glow)">
    <animate attributeName="y1" values="102;136;102" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="y2" values="102;136;102" dur="2.4s" repeatCount="indefinite" />
  </line>
  <text x="572" y="123" class="mono" font-size="11" font-weight="700" fill="#E2E8F0">CLASSIFIER: [ HEALING ]  [ NOT HEALING ]  [ NORMAL ]</text>

  <text x="503" y="164" class="sans" font-size="12" fill="#CBD5E1">Automated image-processing pipeline analyzing skin ulcer</text>
  <text x="503" y="181" class="sans" font-size="12" fill="#CBD5E1">imagery with responsible medical compliance guardrails.</text>
  <text x="503" y="200" class="mono" font-size="10.5" fill="#FDA4AF">DEEP LEARNING &#183; COMPUTER VISION &#183; AI PIPELINE</text>
</svg>

