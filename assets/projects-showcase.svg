<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" role="img" aria-label="Animated Holographic Flagship Project Blueprints">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14" />
      <stop offset="100%" stop-color="#0B1324" />
    </linearGradient>
    <filter id="p-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace; }
      @keyframes ecg {
        0% { stroke-dashoffset: 260; }
        100% { stroke-dashoffset: 0; }
      }
      .ecg-line {
        stroke-dasharray: 180 80;
        animation: ecg 2.6s linear infinite;
      }
      @keyframes wireflow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .wire-line {
        stroke-dasharray: 6 6;
        animation: wireflow 2s linear infinite;
      }
    </style>
  </defs>

  <!-- ==================== CARD 1: RecovFit.ios (Swift) ==================== -->
